name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + artifact (acción reutilizable)
        uses: ./.github/actions/angular-pages
        with:
          node-version: "lts/*"
          caching: "true"
          build-args: "--configuration=production"
          # para hacer deploy a la raiz
          # base-href: "/"
          # para dist sin /browser ajustar esto:
          # dist-path: "dist/mi-app"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
